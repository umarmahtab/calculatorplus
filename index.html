<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enhanced Glassmorphism Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="darkveil.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

    <div class="darkveil-bg" aria-hidden="true">
        <canvas id="darkveil-canvas" class="darkveil-canvas"></canvas>
        <div class="darkveil-dim"></div>
    </div>

    <div class="calculator-container">
        <!-- Theme Toggle -->
        <div class="theme-toggle">
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="amoled-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            <svg class="glass-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        </div>

        <!-- History Toggle -->
        <div class="history-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>

        <!-- History Panel -->
        <div class="history-panel">
            <div class="history-header">
                <span>History</span>
                <span class="history-close">&times;</span>
            </div>
            <div class="history-list">
                <div class="history-empty">No calculations yet</div>
            </div>
        </div>

        <!-- Calculator Screen -->
        <div class="calculator-screen">
            <div class="screen-expression"></div>
            <div class="screen-result">0</div>
        </div>

        <!-- Calculator Buttons -->
        <div class="calculator-buttons">
            <button class="btn btn-operator" data-key="clear">C</button>
            <button class="btn btn-operator" data-key="/">÷</button>
            <button class="btn btn-operator" data-key="*">×</button>
            <button class="btn btn-operator" data-key="backspace">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
            </button>

            <button class="btn btn-number" data-key="7">7</button>
            <button class="btn btn-number" data-key="8">8</button>
            <button class="btn btn-number" data-key="9">9</button>
            <button class="btn btn-operator" data-key="-">-</button>

            <button class="btn btn-number" data-key="4">4</button>
            <button class="btn btn-number" data-key="5">5</button>
            <button class="btn btn-number" data-key="6">6</button>
            <button class="btn btn-operator" data-key="+">+</button>

            <button class="btn btn-number" data-key="1">1</button>
            <button class="btn btn-number" data-key="2">2</button>
            <button class="btn btn-number" data-key="3">3</button>
            <button class="btn btn-equals" data-key="=">=</button>

            <button class="btn btn-operator" data-key="%">%</button>
            <button class="btn btn-number" data-key="0">0</button>
            <button class="btn btn-number" data-key=".">.</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ogl@0.0.126/dist/ogl.umd.js"></script>
    <script src="darkveil.js"></script>
    <script src="script.js"></script>
</body>
</html>
